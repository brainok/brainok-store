<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brainok Download Stats</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --ink: #1d2433;
      --muted: #657083;
      --line: #dde3ee;
      --accent: #1769e0;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding: 32px;
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.05;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 20px 0;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      line-height: 1.1;
    }

    .table-wrap {
      overflow-x: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 760px;
    }

    th,
    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #222f43;
      color: white;
      font-size: 13px;
      letter-spacing: 0;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .downloads {
      font-weight: 700;
      text-align: right;
    }

    .error {
      color: var(--danger);
    }

    @media (max-width: 720px) {
      body {
        padding: 20px;
      }

      header,
      .summary {
        display: block;
      }

      header p,
      .stat {
        margin-top: 12px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Brainok GitHub Download Stats</h1>
        <p>Brainok Store의 public 앱에서 GitHub Release DMG asset 다운로드 수를 자동 합산합니다.</p>
      </div>
      <p id="updated">Loading...</p>
    </header>

    <section class="summary" aria-label="Download summary">
      <div class="stat">
        <span>Total downloads</span>
        <strong id="total">0</strong>
      </div>
      <div class="stat">
        <span>Release assets</span>
        <strong id="assetCount">0</strong>
      </div>
      <div class="stat">
        <span>Checked repositories</span>
        <strong id="repoCount">0</strong>
      </div>
    </section>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>App</th>
            <th>Version</th>
            <th>Asset</th>
            <th>Updated</th>
            <th>Downloads</th>
          </tr>
        </thead>
        <tbody id="stats"></tbody>
      </table>
    </div>
  </main>

  <script>
    const firestoreProjectId = "braionk-lab";

    const numberFormat = new Intl.NumberFormat();
    const tbody = document.getElementById("stats");
    const updated = document.getElementById("updated");
    const total = document.getElementById("total");
    const assetCount = document.getElementById("assetCount");
    const repoCount = document.getElementById("repoCount");

    function createCell(text, className) {
      const cell = document.createElement("td");
      cell.textContent = text;
      if (className) {
        cell.className = className;
      }
      return cell;
    }

    function createLinkCell(text, href) {
      const cell = document.createElement("td");
      const link = document.createElement("a");
      link.href = href;
      link.target = "_blank";
      link.rel = "noreferrer";
      link.textContent = text;
      cell.appendChild(link);
      return cell;
    }

    function addStatusRow(repo, message) {
      const row = document.createElement("tr");
      row.append(
        createCell(repo),
        createCell("-"),
        createCell(message, "error"),
        createCell("-"),
        createCell("-", "downloads")
      );
      tbody.appendChild(row);
    }

    function firestoreValue(value) {
      if (!value) return null;
      if ("stringValue" in value) return value.stringValue;
      if ("integerValue" in value) return Number(value.integerValue);
      if ("doubleValue" in value) return Number(value.doubleValue);
      if ("booleanValue" in value) return value.booleanValue;
      if ("timestampValue" in value) return value.timestampValue;
      if ("nullValue" in value) return null;
      if ("mapValue" in value) return firestoreFields(value.mapValue.fields || {});
      if ("arrayValue" in value) return (value.arrayValue.values || []).map(firestoreValue);
      return null;
    }

    function firestoreFields(fields) {
      return Object.fromEntries(
        Object.entries(fields || {}).map(([key, value]) => [key, firestoreValue(value)])
      );
    }

    function githubRepoFromUrl(url) {
      if (!url) return null;

      try {
        const parsed = new URL(url);
        if (parsed.hostname !== "github.com") return null;

        const [owner, repo] = parsed.pathname.split("/").filter(Boolean);
        if (!owner || !repo) return null;

        return { owner, repo };
      } catch {
        return null;
      }
    }

    function appDownloadGithubRepos(apps) {
      const repoMap = new Map();

      apps
        .filter(app => app.status === "active")
        .filter(app => (app.appType || "application") === "application")
        .forEach(app => {
          const urls = [
            app.downloads?.macUrl,
            app.downloads?.releaseUrl
          ];

          urls.forEach(url => {
            const githubRepo = githubRepoFromUrl(url);
            if (!githubRepo) return;

            const key = `${githubRepo.owner}/${githubRepo.repo}`;
            const existing = repoMap.get(key);
            if (existing) {
              existing.apps.push(app.name || app.appId || key);
              return;
            }

            repoMap.set(key, {
              ...githubRepo,
              apps: [app.name || app.appId || key]
            });
          });
        });

      return Array.from(repoMap.values()).sort((a, b) => {
        const firstAppA = a.apps[0] || a.repo;
        const firstAppB = b.apps[0] || b.repo;
        return firstAppA.localeCompare(firstAppB);
      });
    }

    async function loadPublicApps() {
      const res = await fetch(`https://firestore.googleapis.com/v1/projects/${firestoreProjectId}/databases/(default)/documents:runQuery`, {
        method: "POST",
        headers: {
          "content-type": "application/json"
        },
        body: JSON.stringify({
          structuredQuery: {
            from: [{ collectionId: "apps" }],
            where: {
              fieldFilter: {
                field: { fieldPath: "visibility" },
                op: "EQUAL",
                value: { stringValue: "public" }
              }
            }
          }
        })
      });

      if (!res.ok) {
        throw new Error(`Firestore API ${res.status}`);
      }

      const rows = await res.json();
      return rows
        .map(row => row.document?.fields ? firestoreFields(row.document.fields) : null)
        .filter(Boolean);
    }

    async function loadStats() {
      let totalDownloads = 0;
      let totalAssets = 0;
      let checkedRepos = 0;
      let repos = [];

      try {
        const apps = await loadPublicApps();
        repos = appDownloadGithubRepos(apps);
      } catch (e) {
        console.error("Could not load public apps", e);
        addStatusRow("Brainok Store apps", e instanceof Error ? e.message : "Failed to load");
      }

      if (repos.length === 0) {
        repoCount.textContent = "0 / 0";
        updated.textContent = `Last updated: ${new Date().toLocaleString()}`;
        return;
      }

      for (const repo of repos) {
        try {
          const res = await fetch(`https://api.github.com/repos/${repo.owner}/${repo.repo}/releases`);
          if (!res.ok) {
            throw new Error(`GitHub API ${res.status}`);
          }

          const releases = await res.json();
          checkedRepos += 1;

          releases.forEach(release => {
            release.assets.forEach(asset => {
              if (!asset.name.toLowerCase().endsWith(".dmg")) return;

              totalDownloads += asset.download_count;
              totalAssets += 1;

              const row = document.createElement("tr");
              row.append(
                createLinkCell(repo.apps.join(", "), `https://github.com/${repo.owner}/${repo.repo}`),
                createLinkCell(release.tag_name, release.html_url),
                createLinkCell(asset.name, asset.browser_download_url),
                createCell(asset.updated_at ? new Date(asset.updated_at).toLocaleDateString() : "-"),
                createCell(numberFormat.format(asset.download_count), "downloads")
              );
              tbody.appendChild(row);
            });
          });
        } catch (e) {
          console.error(repo, e);
          addStatusRow(repo.apps.join(", ") || repo.repo, e instanceof Error ? e.message : "Failed to load");
        }
      }

      total.textContent = numberFormat.format(totalDownloads);
      assetCount.textContent = numberFormat.format(totalAssets);
      repoCount.textContent = `${checkedRepos} / ${repos.length}`;
      updated.textContent = `Last updated: ${new Date().toLocaleString()}`;
    }

    loadStats();
  </script>
</body>
</html>
